kind = "web"
previewPath = "/"
title = "Shawn Stephen Abok | Portfolio"
description = "A professional finance and Financial Technology student portfolio for Shawn Stephen Abok, preserving the structure and dark blue visual identity of his Wix reference with editable placeholder content, projects, education, experience and contact."
version = "1.0.0"
id = "artifacts/shawn-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23171

[services.development]
run = "pnpm --filter @workspace/shawn-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shawn-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/shawn-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23171"
BASE_PATH = "/"
